name: Build Changed C# Projects for PR

on: pull_request

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Find changed projects
      id: projects
      shell: pwsh
      run: |
        & ./eng/tests/Get-ChangedProjects.Tests.ps1
        $changedFiles = @(git -c core.quotepath=false diff --name-only --no-renames HEAD^1 HEAD)
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to get changed files."
        }
        $projects = @{
          'windows-latest' = @(& ./eng/Get-ChangedProjects.ps1 -ChangedFiles $changedFiles -ExcludedProjectsFile ./eng/excluded_projects_windows.txt)
          'macos-26' = @(& ./eng/Get-ChangedProjects.ps1 -ChangedFiles $changedFiles -ExcludedProjectsFile ./eng/excluded_projects_macos.txt)
        }
        "projects=$($projects | ConvertTo-Json -Compress -Depth 3)" >> $env:GITHUB_OUTPUT

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # Keep the macos-26 matrix value so the check context stays `build (macos-26)`,
        # which main requires. The .NET 11 Apple builds need Xcode 27.2, so that entry runs on the xcode-27 runner.
        os: [windows-latest, macos-26]

    # Expand both required check names, but use Linux for no-build runs.
    runs-on: ${{ toJSON(fromJSON(needs.changes.outputs.projects)[matrix.os]) == '[]' && 'ubuntu-latest' || (matrix.os == 'macos-26' && 'xcode-27' || matrix.os) }}
    env:
      PROJECTS: ${{ toJSON(fromJSON(needs.changes.outputs.projects)[matrix.os]) }}

    steps:
    - name: No projects to build
      if: env.PROJECTS == '[]'
      shell: pwsh
      run: |
        "No buildable projects changed; SDK installation and sample builds skipped." >> $env:GITHUB_STEP_SUMMARY

    - name: Checkout code
      if: env.PROJECTS != '[]'
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Install .NET SDKs
      if: env.PROJECTS != '[]'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Install .NET MAUI Workload
      if: env.PROJECTS != '[]'
      run: |
        dotnet workload config --update-mode manifests
        dotnet workload install maui

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_27.2.app
      if: env.PROJECTS != '[]' && runner.os == 'macOS'

    - name: Prepare local NuGet sample packages
      if: env.PROJECTS != '[]'
      run: |
        $projects = @($env:PROJECTS | ConvertFrom-Json)
        if (-not ($projects | Where-Object { $_ -like './11.0/Packaging/NuGetWithMSBuildFiles/*' })) {
          Write-Output "No NuGetWithMSBuildFiles changes; skipping local package preparation."
          exit 0
        }
        # PackageConsumerApp restores SamplePackage from this local feed, so produce it before any project builds.
        $sampleSource = "./11.0/Packaging/NuGetWithMSBuildFiles/src"
        New-Item -ItemType Directory -Force -Path "$sampleSource/artifacts" | Out-Null
        dotnet build "$sampleSource/SamplePackage/SamplePackage.csproj"
        if ($LASTEXITCODE -ne 0) {
          Write-Output "::error:: Failed to produce SamplePackage for PackageConsumerApp"
          exit $LASTEXITCODE
        }
      shell: pwsh

    - name: Find and build changed projects
      if: env.PROJECTS != '[]'
      run: |
        $failedProjectCount=0
        $jobSummaryFile=$env:GITHUB_STEP_SUMMARY

        Write-Output "# .NET MAUI Sample Apps Build Status (${{ runner.os }})" | Out-File -FilePath $jobSummaryFile -Append
        Write-Output "Only projects that have changes are built." | Out-File -FilePath $jobSummaryFile -Append
        Write-Output "| Project | Build Status |" | Out-File -FilePath $jobSummaryFile -Append
        Write-Output "|---|---|" | Out-File -FilePath $jobSummaryFile -Append

        foreach ($projectToBuild in ($env:PROJECTS | ConvertFrom-Json)) {
          Write-Output "::group:: Building $projectToBuild"

          dotnet build $projectToBuild

          if ($LASTEXITCODE -gt 0) {
            Write-Output "::error:: Build failed for $projectToBuild"
            Write-Output "| $projectToBuild | :x: |" | Out-File -FilePath $jobSummaryFile -Append

            $failedProjectCount++
          }
          else {
            Write-Output "Build succeeded for $projectToBuild"
            Write-Output "| $projectToBuild | :white_check_mark: |" | Out-File -FilePath $jobSummaryFile -Append
          }

          $proj_dir = [System.IO.Path]::GetDirectoryName($projectToBuild)
          Write-Output "Cleaning up bin & obj in $proj_dir"

          try {
            Get-ChildItem -Path $proj_dir -Directory -Recurse -Include bin,obj | Remove-Item -Recurse -Force
          } catch {
            Write-Output "::warning:: Failed to clean up bin & obj in $proj_dir"
          }

          Write-Output "::endgroup::"
        }

        if ($failedProjectCount -gt 0) {
            Write-Output "" | Out-File -FilePath $jobSummaryFile -Append
            Write-Output "# Failed builds: $failedProjectCount" | Out-File -FilePath $jobSummaryFile -Append
            exit $failedProjectCount
        }
      shell: pwsh
